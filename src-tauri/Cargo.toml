[package]
name = "pandaterm"
edition.workspace = true
license.workspace = true
version.workspace = true

[[bin]]
name = "pandaterm"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2.2.0", features = [] }

[dependencies]
panda-core = { path = "../crates/panda-core" }
panda-crypto = { path = "../crates/panda-crypto" }
panda-session = { path = "../crates/panda-session" }
panda-transfer = { path = "../crates/panda-transfer" }
serde.workspace = true
serde_json.workspace = true
tauri = { version = "2.2.5", features = [] }
tokio.workspace = true
tracing.workspace = true
uuid.workspace = true
chrono.workspace = true
encoding_rs = "0.8.35"
portable-pty = "0.9.0"
russh = "0.51"
sysinfo = "0.33"
reqwest = { version = "0.13.4", default-features = false, features = ["json", "rustls", "stream"] }
zeroize = "1.9.0"

[target."cfg(windows)".dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Storage_FileSystem"] }
