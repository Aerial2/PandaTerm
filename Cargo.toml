[workspace]
members = [
    "crates/panda-core",
    "crates/panda-session",
    "crates/panda-crypto",
    "src-tauri",
]
resolver = "2"

[workspace.package]
edition = "2021"
license = "MIT"
version = "0.1.3"

[workspace.dependencies]
async-trait = "0.1.83"
chrono = { version = "0.4.39", features = ["serde"] }
serde = { version = "1.0.217", features = ["derive"] }
serde_json = "1.0.135"
thiserror = "2.0.11"
tokio = { version = "1.43.0", features = ["rt-multi-thread", "macros", "sync", "time", "process"] }
tracing = "0.1.41"
uuid = { version = "1.12.0", features = ["v4", "serde"] }
